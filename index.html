<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComptaDigital | Balsame Hammioui</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f8f7f4;
  --sidebar: #1a1a2e;
  --card: #ffffff;
  --text: #1c1c2e;
  --muted: #7a7a9a;
  --primary: #2d5be3;
  --primary-light: #eef2ff;
  --success: #059669;
  --danger: #dc2626;
  --warning: #d97706;
  --border: #e8e8f0;
  --accent: #f0f0f8;
  --shadow: 0 2px 16px rgba(30,30,60,0.07);
}
[data-theme="dark"] {
  --bg: #0d0d1a;
  --sidebar: #060610;
  --card: #13132a;
  --text: #e8e8f5;
  --muted: #6a6a8a;
  --border: #1e1e3a;
  --accent: #1a1a30;
  --primary-light: #1a2050;
  --shadow: 0 2px 16px rgba(0,0,0,0.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  display: flex;
  flex-direction: row;
  height: 100vh;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  transition: background 0.3s;
}

/* --- SIDEBAR RESPONSIVE --- */
.sidebar {
  width: 240px;
  background: var(--sidebar);
  display: flex;
  flex-direction: column;
  padding: 32px 0;
  flex-shrink: 0;
  transition: transform 0.3s ease;
  z-index: 1000;
}

/* --- MAIN CONTENT --- */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 24px; /* Réduit pour mobile */
}

/* --- MOBILE HEADER & BURGER --- */
.mobile-nav-toggle {
  display: none;
  background: var(--sidebar);
  color: white;
  padding: 10px 15px;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 1001;
}

.burger-btn {
  background: none;
  border: 1px solid rgba(255,255,255,0.2);
  color: white;
  padding: 5px 10px;
  border-radius: 4px;
  cursor: pointer;
}

/* --- TYPOGRAPHIE & ELEMENTS --- */
.logo { padding: 0 24px 32px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.logo-text { font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase; color: #4a6ff5; font-weight: 600; }
.nav { padding: 20px 12px; flex: 1; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: rgba(255,255,255,0.45); font-size: 0.82rem; margin-bottom: 2px; }
.nav-item.active { background: rgba(45,91,227,0.2); color: #6b8ff7; }

.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
.page-title { font-size: 1.2rem; font-weight: 600; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }

/* --- TABLES RESPONSIVES --- */
.table-container { width: 100%; overflow-x: auto; }
table { width: 100%; min-width: 500px; border-collapse: collapse; }
th { text-align: left; padding: 10px; font-size: 0.65rem; color: var(--muted); border-bottom: 2px solid var(--border); }
td { padding: 10px; font-size: 0.8rem; border-bottom: 1px solid var(--border); }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 15px; }
.kpi-value { font-size: 1.1rem; font-weight: 600; font-family: 'DM Mono'; }

.charts-grid, .bilan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

/* --- MEDIA QUERIES (MOBILE) --- */
@media (max-width: 850px) {
  body { flex-direction: column; }
  .sidebar {
    position: fixed;
    left: 0; top: 45px; bottom: 0;
    transform: translateX(-100%);
    width: 260px;
  }
  .sidebar.open { transform: translateX(0); }
  .mobile-nav-toggle { display: flex; }
  .main { padding: 16px; }
  .charts-grid, .bilan-grid { grid-template-columns: 1fr; }
  .page-header { flex-direction: column; align-items: flex-start; }
}

/* Utilitaires */
.mono { font-family: 'DM Mono', monospace; }
.right { text-align: right; }
.text-success { color: var(--success); }
.text-danger { color: var(--danger); }
.btn-primary { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 500; }
.page { display: none; }
.page.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body data-theme="light">

<!-- Barre de navigation Mobile -->
<div class="mobile-nav-toggle">
  <div class="logo-text" style="color:white; letter-spacing:1px">ComptaDigital</div>
  <button class="burger-btn" onclick="toggleSidebar()">Menu ☰</button>
</div>

<div class="sidebar" id="sidebar">
  <div class="logo">
    <div class="logo-text">ComptaDigital</div>
    <div class="logo-sub" style="color:rgba(255,255,255,0.3); font-size:0.7rem">Gestion PCM</div>
  </div>
  <div class="nav">
    <div class="nav-item active" onclick="showPage('saisie',this)">Journal</div>
    <div class="nav-item" onclick="showPage('stats',this)">Dashboard</div>
    <div class="nav-item" onclick="showPage('bilan',this)">Bilan</div>
    <div class="nav-item" onclick="showPage('pcm',this)">Plan Comptable</div>
    <div class="nav-item" onclick="showPage('export',this)">Export</div>
  </div>
  <div class="sidebar-footer" style="padding:20px; border-top:1px solid rgba(255,255,255,0.1); color:white; font-size:0.7rem">
    B. HAMMIOUI
  </div>
</div>

<div class="main">
  <div class="page-header">
    <div>
      <h2 class="page-title" id="pageTitle">Journal Comptable</h2>
    </div>
    <button class="theme-btn" style="padding:8px 12px; border-radius:6px; cursor:pointer" onclick="toggleTheme()">Sombre / Clair</button>
  </div>

  <!-- PAGE SAISIE -->
  <div id="saisie" class="page active">
    <div class="card">
      <div class="form-grid">
        <div>
          <label style="font-size:0.7rem; font-weight:600; color:var(--muted)">Nature</label>
          <select id="type" style="width:100%; padding:10px; border-radius:6px; border:1px solid var(--border)">
            <option value="achat">Achat (6111)</option>
            <option value="vente">Vente (7111)</option>
            <option value="service">Services (6141)</option>
            <option value="salaire">Salaires (6171)</option>
          </select>
        </div>
        <div>
          <label style="font-size:0.7rem; font-weight:600; color:var(--muted)">Montant HT</label>
          <input type="number" id="ht" placeholder="0.00" style="width:100%; padding:10px; border-radius:6px; border:1px solid var(--border)">
        </div>
        <div>
          <label style="font-size:0.7rem; font-weight:600; color:var(--muted)">Libellé</label>
          <input type="text" id="libelle" placeholder="Référence" style="width:100%; padding:10px; border-radius:6px; border:1px solid var(--border)">
        </div>
      </div>
      <button class="btn-primary" onclick="ajouterEcriture()">Enregistrer l'opération</button>
    </div>

    <div class="card">
      <div class="table-container">
        <div id="journal-output"></div>
      </div>
    </div>
  </div>

  <!-- PAGE STATS -->
  <div id="stats" class="page">
    <div class="kpi-grid">
      <div class="kpi">
        <div style="font-size:0.6rem; color:var(--muted)">CA TOTAL</div>
        <div class="kpi-value text-success" id="kpi-ca">0 MAD</div>
      </div>
      <div class="kpi">
        <div style="font-size:0.6rem; color:var(--muted)">CHARGES</div>
        <div class="kpi-value text-danger" id="kpi-charges">0 MAD</div>
      </div>
    </div>
    <div class="charts-grid">
      <div class="card"><canvas id="chartDoughnut"></canvas></div>
      <div class="card"><canvas id="chartBar"></canvas></div>
    </div>
  </div>

  <!-- PAGE BILAN -->
  <div id="bilan" class="page">
    <div class="bilan-grid">
        <div class="card">
            <h3 style="font-size:0.8rem; margin-bottom:15px; color:var(--primary)">ACTIF</h3>
            <div id="bilan-actif-list"></div>
        </div>
        <div class="card">
            <h3 style="font-size:0.8rem; margin-bottom:15px; color:var(--success)">PASSIF</h3>
            <div id="bilan-passif-list"></div>
        </div>
    </div>
  </div>

</div>

<script>
let ecritures = [];
let chartDoughnut = null;
let chartBar = null;

// Gérer le menu mobile
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function showPage(id, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
  
  // Fermer la sidebar sur mobile après clic
  if(window.innerWidth < 850) toggleSidebar();
  
  if (id === 'stats') setTimeout(renderCharts, 100);
}

function toggleTheme() {
  const b = document.body;
  b.setAttribute('data-theme', b.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
}

function ajouterEcriture() {
  const ht = parseFloat(document.getElementById('ht').value);
  const type = document.getElementById('type').value;
  const libelle = document.getElementById('libelle').value || 'Opération';
  if (!ht) return alert('Saisir un montant');

  const obj = {
    id: Date.now(),
    type,
    ht,
    libelle,
    tva: ht * 0.20,
    ttc: ht * 1.20,
    date: new Date().toLocaleDateString()
  };
  
  ecritures.push(obj);
  renderJournal();
  updateKPIs();
  document.getElementById('ht').value = '';
}

function renderJournal() {
  const out = document.getElementById('journal-output');
  if(ecritures.length === 0) { out.innerHTML = "Aucune donnée"; return; }
  
  let html = `<table><tr><th>Date</th><th>Libellé</th><th>HT</th><th>TTC</th></tr>`;
  ecritures.forEach(e => {
    html += `<tr><td>${e.date}</td><td>${e.libelle}</td><td class="mono">${e.ht}</td><td class="mono">${e.ttc}</td></tr>`;
  });
  html += `</table>`;
  out.innerHTML = html;
}

function updateKPIs() {
  let ca = 0, ch = 0;
  ecritures.forEach(e => {
    if(e.type === 'vente') ca += e.ht;
    else ch += e.ht;
  });
  document.getElementById('kpi-ca').innerText = ca.toLocaleString() + ' MAD';
  document.getElementById('kpi-charges').innerText = ch.toLocaleString() + ' MAD';
}

function renderCharts() {
  let ca = 0, ch = 0;
  ecritures.forEach(e => { if(e.type === 'vente') ca += e.ht; else ch += e.ht; });

  const ctxD = document.getElementById('chartDoughnut').getContext('2d');
  if(chartDoughnut) chartDoughnut.destroy();
  chartDoughnut = new Chart(ctxD, {
    type: 'doughnut',
    data: {
      labels: ['Produits', 'Charges'],
      datasets: [{ data: [ca, ch], backgroundColor: ['#059669', '#dc2626'] }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });
}
</script>
</body>
</html>

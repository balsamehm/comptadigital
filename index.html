<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComptaDigital | Saisie Journal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-sidebar: #0a0e1a;
            --bg-main: #f0f4f9;
            --primary: #2b61e5;
            --text-dark: #1e293b;
            --text-light: #ffffff;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            background: var(--bg-main);
            color: var(--text-dark);
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
            color: var(--text-light);
            flex-shrink: 0;
        }

        .logo {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 50px;
            text-align: center;
        }

        .nav-item {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            color: #94a3b8;
            transition: 0.3s;
        }

        .nav-item:hover { color: white; }
        .nav-item.active { background: var(--primary); color: white; font-weight: 600; }

        .sidebar-footer {
            margin-top: auto;
            font-size: 0.7rem;
            color: #475569;
            line-height: 1.4;
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            position: relative;
        }

        .header-top {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
        }

        .btn-mode {
            background: white;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid #eef2f6;
        }

        .section-title {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: var(--primary);
            margin-right: 12px;
            border-radius: 2px;
        }

        /* GRID FORM */
        .form-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 0.65rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-dark);
        }

        .btn-save {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-save:hover { background: #1e4fd1; }

        .empty-state {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        /* --- CORRECTIF MOBILE --- */
        @media (max-width: 850px) {
            body { flex-direction: column; height: auto; }
            .sidebar { 
                width: 100%; 
                padding: 15px; 
                height: auto; 
                position: sticky; 
                top: 0; 
                z-index: 100;
            }
            .logo { display: none; }
            .nav-container { display: flex; overflow-x: auto; gap: 10px; scrollbar-width: none; }
            .nav-container::-webkit-scrollbar { display: none; }
            .nav-item { margin-bottom: 0; white-space: nowrap; padding: 8px 15px; font-size: 0.75rem; }
            .sidebar-footer { display: none; }
            
            .main-content { padding: 20px; }
            .form-grid { grid-template-columns: 1fr; }
            .header-top { display: none; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">COMPTADIGITAL</div>
        <div class="nav-container">
            <div class="nav-item active">Saisie Journal</div>
            <div class="nav-item">Plan Comptable</div>
            <div class="nav-item">Statistiques</div>
            <div class="nav-item">Sauvegarde</div>
        </div>
        <div class="sidebar-footer">
            Développé par<br>
            <strong>BALSAME HAMMIOUI</strong>
        </div>
    </div>

    <div class="main-content">
        <div class="header-top">
            <button class="btn-mode">Changer de mode</button>
        </div>

        <div class="card">
            <div class="section-title">Nouvelle opération</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Nature</label>
                    <select>
                        <option>Achat (6111)</option>
                        <option>Vente (7111)</option>
                        <option>Service (6141)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Montant HT (MAD)</label>
                    <input type="number" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Référence</label>
                    <input type="text" placeholder="REF001">
                </div>
                <div class="form-group">
                    <label>Règlement</label>
                    <select>
                        <option>Crédit</option>
                        <option>Banque</option>
                        <option>Caisse</option>
                    </select>
                </div>
            </div>
            <button class="btn-save">Enregistrer au Journal</button>
        </div>

        <div class="card">
            <div class="section-title">Historique des écritures</div>
            <div class="empty-state">Aucune écriture enregistrée.</div>
        </div>
    </div>

</body>
</html>

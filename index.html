<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComptaDigital | Saisie Journal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=DM+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-sidebar: #0a0e1a;
            --bg-main: #f0f4f9;
            --card-bg: #ffffff;
            --primary: #2b61e5;
            --text-dark: #1e293b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --input-bg: #f8fafc;
        }

        [data-theme="dark"] {
            --bg-main: #020617;
            --card-bg: #0f172a;
            --text-dark: #f1f5f9;
            --border: #1e293b;
            --input-bg: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            background: var(--bg-main);
            color: var(--text-dark);
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
            color: #ffffff;
            flex-shrink: 0;
        }

        .logo {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 50px;
            text-align: center;
        }

        .nav-item {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .nav-item.active { background: var(--primary); color: white; font-weight: 600; }

        .sidebar-footer {
            margin-top: auto;
            font-size: 0.7rem;
            color: #475569;
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header-top {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
        }

        .btn-mode {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            color: var(--text-dark);
            font-weight: 600;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }

        .section-title {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: var(--primary);
            margin-right: 12px;
            border-radius: 2px;
        }

        /* FORM */
        .form-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-dark);
            outline: none;
        }

        .btn-save {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        /* HISTORIQUE */
        .entry-row {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr 1fr;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            align-items: center;
        }

        .entry-row:last-child { border-bottom: none; }
        .amount { font-family: 'DM Mono', monospace; font-weight: 600; }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-achat { background: #fee2e2; color: #ef4444; }
        .badge-vente { background: #dcfce7; color: #10b981; }

        @media (max-width: 850px) {
            body { flex-direction: column; height: auto; }
            .sidebar { width: 100%; padding: 15px; height: auto; position: sticky; top: 0; z-index: 100; }
            .logo, .sidebar-footer { display: none; }
            .nav-container { display: flex; overflow-x: auto; gap: 10px; }
            .nav-item { margin-bottom: 0; white-space: nowrap; padding: 8px 15px; font-size: 0.75rem; }
            .main-content { padding: 20px; }
            .form-grid, .entry-row { grid-template-columns: 1fr; gap: 10px; }
            .entry-row { padding: 20px 0; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">COMPTADIGITAL</div>
        <div class="nav-container">
            <div class="nav-item active">Saisie Journal</div>
            <div class="nav-item">Plan Comptable</div>
            <div class="nav-item">Statistiques</div>
            <div class="nav-item">Sauvegarde</div>
        </div>
        <div class="sidebar-footer">
            Développé par<br>
            <strong>BALSAME HAMMIOUI</strong>
        </div>
    </div>

    <div class="main-content">
        <div class="header-top">
            <button class="btn-mode" onclick="toggleTheme()">Changer de mode</button>
        </div>

        <div class="card">
            <div class="section-title">Nouvelle opération</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Nature</label>
                    <select id="nature">
                        <option value="Achat (6111)">Achat (6111)</option>
                        <option value="Vente (7111)">Vente (7111)</option>
                        <option value="Service (6141)">Service (6141)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Montant HT (MAD)</label>
                    <input type="number" id="montant" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Référence</label>
                    <input type="text" id="ref" placeholder="REF001">
                </div>
                <div class="form-group">
                    <label>Règlement</label>
                    <select id="reglement">
                        <option>Crédit</option>
                        <option>Banque</option>
                        <option>Caisse</option>
                    </select>
                </div>
            </div>
            <button class="btn-save" onclick="ajouterEcriture()">Enregistrer au Journal</button>
        </div>

        <div class="card">
            <div class="section-title">Historique des écritures</div>
            <div id="historique-list">
                <div class="empty-state" style="color: #94a3b8; font-size: 0.9rem;">Aucune écriture enregistrée.</div>
            </div>
        </div>
    </div>

    <script>
        let ecritures = [];

        function toggleTheme() {
            const body = document.body;
            body.dataset.theme = body.dataset.theme === "dark" ? "light" : "dark";
        }

        function ajouterEcriture() {
            const nature = document.getElementById('nature').value;
            const montant = document.getElementById('montant').value;
            const ref = document.getElementById('ref').value || "SANS-REF";
            const reglement = document.getElementById('reglement').value;

            if (!montant || montant <= 0) {
                alert("Veuillez saisir un montant valide.");
                return;
            }

            const nouvelleEcriture = { nature, montant, ref, reglement, date: new Date().toLocaleDateString() };
            ecritures.unshift(nouvelleEcriture); // Ajouter au début

            // Reset des champs
            document.getElementById('montant').value = "";
            document.getElementById('ref').value = "";

            renderJournal();
        }

        function renderJournal() {
            const list = document.getElementById('historique-list');
            if (ecritures.length === 0) {
                list.innerHTML = '<div class="empty-state">Aucune écriture enregistrée.</div>';
                return;
            }

            list.innerHTML = ecritures.map(e => `
                <div class="entry-row">
                    <div><span class="badge ${e.nature.includes('Vente') ? 'badge-vente' : 'badge-achat'}">${e.nature}</span></div>
                    <div style="font-weight: 600;">${e.ref}</div>
                    <div class="amount">${parseFloat(e.montant).toLocaleString()} MAD</div>
                    <div style="color: var(--text-muted); font-size: 0.75rem;">via ${e.reglement}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>

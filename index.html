<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaDigital Pro | Balsame Hammioui</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=DM+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-sidebar: #0f172a;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --border: #e2e8f0;
            --accent: #f1f5f9;
            --success: #10b981;
            --danger: #ef4444;
        }

        [data-theme="dark"] {
            --bg-body: #020617;
            --bg-sidebar: #000000;
            --bg-card: #0f172a;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --accent: #1e293b;
            --primary-light: #172554;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background: var(--bg-body);
            color: var(--text-main);
            overflow: hidden;
        }

        /* SIDEBAR DESKTOP */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .sidebar h1 {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
            text-align: center;
        }

        .nav-item {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 5px;
            cursor: pointer;
            color: #94a3b8;
            font-size: 0.8rem;
            transition: 0.2s;
            white-space: nowrap;
        }

        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: var(--primary); color: white; }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* CORRECTION MOBILE (L'écran de ta capture) */
        @media (max-width: 850px) {
            body { flex-direction: column; height: auto; overflow: auto; }
            
            .sidebar { 
                width: 100%; 
                padding: 10px; 
                height: auto; 
                position: sticky; 
                top: 0; 
                z-index: 1000;
                box-sizing: border-box;
            }

            .sidebar h1 { display: none; } /* On cache le titre sur mobile pour gagner de la place */

            .nav-container { 
                display: flex; 
                flex-direction: row; 
                overflow-x: auto; 
                gap: 5px; 
                padding-bottom: 5px;
            }

            .nav-item { 
                flex: 0 0 auto; 
                padding: 8px 12px; 
                font-size: 0.7rem; 
                margin-bottom: 0;
            }

            .main-content { padding: 15px; width: 100%; box-sizing: border-box; }
            
            .form-grid { grid-template-columns: 1fr !important; gap: 10px; }
            .kpi-grid { grid-template-columns: 1fr 1fr !important; gap: 10px; }
            
            .card { padding: 15px; margin-bottom: 15px; }
            .kpi-value { font-size: 0.9rem; }
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-body);
            color: var(--text-main);
            margin-top: 5px;
            box-sizing: border-box;
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
        }

        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .kpi-card { background: var(--bg-card); padding: 15px; border-radius: 10px; border: 1px solid var(--border); text-align: center; }
        .kpi-label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; }
        .kpi-value { font-size: 1rem; font-weight: 700; font-family: 'DM Mono', monospace; margin-top: 5px; }

        .journal-entry { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 15px; overflow: hidden; font-size: 0.8rem; }
        .entry-header { background: var(--accent); padding: 10px; display: flex; justify-content: space-between; font-weight: 600; }
        
        .page { display: none; }
        .page.active { display: block; }
        
        .mono { font-family: 'DM Mono', monospace; }
        .right { text-align: right; }
    </style>
</head>
<body data-theme="light">

    <div class="sidebar">
        <h1>ComptaDigital</h1>
        <div class="nav-container">
            <div class="nav-item active" onclick="showPage('saisie', this)">Journal</div>
            <div class="nav-item" onclick="showPage('stats', this); renderCharts();">Analyses</div>
            <div class="nav-item" onclick="showPage('bilan-page', this)">Bilan</div>
            <div class="nav-item" onclick="showPage('save', this)">Options</div>
        </div>
    </div>

    <div class="main-content">
        <div id="saisie" class="page active">
            <div class="kpi-grid">
                <div class="kpi-card"><div class="kpi-label">CA HT</div><div id="kpi-ca" class="kpi-value">0 DH</div></div>
                <div class="kpi-card"><div class="kpi-label">Résultat</div><div id="kpi-resultat" class="kpi-value">0 DH</div></div>
            </div>

            <div class="card">
                <div class="form-grid">
                    <div><label>Type</label><select id="type">
                        <option value="vente">Vente (7111)</option>
                        <option value="achat">Achat (6111)</option>
                        <option value="service">Service (6141)</option>
                    </select></div>
                    <div><label>Montant HT</label><input type="number" id="ht" placeholder="0.00"></div>
                    <div><label>Libellé</label><input type="text" id="libelle" placeholder="FAC-2026"></div>
                    <div><label>Règlement</label><select id="reglement">
                        <option value="5141">Banque</option>
                        <option value="5161">Caisse</option>
                    </select></div>
                </div>
                <button class="btn-submit" onclick="ajouterEcriture()">Enregistrer</button>
            </div>
            <div id="journal-output"></div>
        </div>

        <!-- Les autres pages (stats, bilan, save) restent identiques structurellement -->
        <div id="stats" class="page"><div class="card"><canvas id="chartDoughnut"></canvas></div></div>
        
        <div id="bilan-page" class="page">
            <div class="card">
                <div style="overflow-x:auto">
                    <table style="width:100%; border-collapse:collapse; font-size:0.75rem">
                        <tr style="background:var(--accent)"><th>ACTIF</th><th>MAD</th><th>PASSIF</th><th>MAD</th></tr>
                        <tr><td>Trésorerie</td><td id="b-tresorerie" class="mono">0</td><td>Résultat</td><td id="b-resultat-passif" class="mono">0</td></tr>
                    </table>
                </div>
            </div>
        </div>

        <div id="save" class="page">
            <div class="card">
                <button class="btn-submit" onclick="toggleTheme()">Changer Thème</button>
                <button class="btn-submit" style="background:#64748b" onclick="saveLocal()">Sauvegarder</button>
            </div>
        </div>
    </div>

    <script>
        let ecritures = [];
        function showPage(p, el) {
            document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
            document.getElementById(p).classList.add('active');
            el.classList.add('active');
        }
        function ajouterEcriture() {
            const ht = parseFloat(document.getElementById('ht').value);
            if(!ht) return;
            const e = {
                ht, type: document.getElementById('type').value,
                libelle: document.getElementById('libelle').value || "REF",
                date: new Date().toLocaleDateString(),
                isCharge: document.getElementById('type').value !== 'vente'
            };
            ecritures.push(e);
            renderJournal();
            updateKPIs();
        }
        function renderJournal() {
            const out = document.getElementById('journal-output');
            out.innerHTML = ecritures.map(e => `
                <div class="journal-entry">
                    <div class="entry-header"><span>${e.libelle}</span><span>${e.date}</span></div>
                    <div style="padding:10px">${e.type.toUpperCase()} : <span class="mono">${e.ht} DH</span></div>
                </div>
            `).join('');
        }
        function updateKPIs() {
            let ca = 0, res = 0;
            ecritures.forEach(e => {
                if(!e.isCharge) { ca += e.ht; res += e.ht; }
                else { res -= e.ht; }
            });
            document.getElementById('kpi-ca').innerText = ca + " DH";
            document.getElementById('kpi-resultat').innerText = res + " DH";
        }
        // ... (Autres fonctions simplifiées pour l'exemple)
    </script>
</body>
</html>
